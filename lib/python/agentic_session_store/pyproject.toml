[project]
name = "agentic-session-store"
version = "0.4.0"
description = "Session-store capability contract + env-var interface for agentic-primitives workspaces"
readme = "README.md"
license = { text = "MIT" }
# 3.11 is the real floor: contract.py imports enum.StrEnum, added in 3.11.
requires-python = ">=3.11"
authors = [
    { name = "Agentic Primitives Team" }
]
keywords = ["ai", "agents", "session-store", "workspace", "doctor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = ["tomlkit>=0.13.3,<1"]

[project.scripts]
syn-delegate = "agentic_session_store.delegate:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff==0.16.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentic_session_store*"]
exclude = ["tests*"]

[tool.ruff]
extend = "../../../ruff.toml"
target-version = "py311"
src = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--confcutdir=."
