# =============================================================================
# Build Workspace Images — Build, Sign, Publish to GHCR
# =============================================================================
#
# Two publishing channels, and only one of them is for consumers.
#
#   release channel — push to `release` (protected, PR-only, gated by
#       release-gate.yml). Publishes :<manifest version>, :<cli version>,
#       :latest and :<sha>. Signed with cosign. This is what consumers pull.
#
#   edge channel — push to `main` (development, no review required).
#       Publishes :edge and :<sha> ONLY. Never :latest, never a version tag.
#       These images are unstable, unreviewed and ungated. They exist so that
#       a developer can pull a fresh mid-cycle image without anyone needing to
#       re-point the release channel at main.
#
#   Pull requests build but never publish and never sign.
#
# Edge images are signed like release images. cosign keyless proves "built by
# this workflow from this repo"; it never proved the code was reviewed, and
# leaving edge unsigned would break a consumer that verifies signatures
# fail-closed. The channel is distinguished by the `agentic.image.channel`
# label and by the tag, not by the presence of a signature.
#
# Pipeline:
#   1. Stage build context via build-provider.py
#   2. Build multi-arch container images
#   3. Push to GHCR with channel-appropriate tags
#   4. Sign with cosign (keyless OIDC)
#
# Security:
#   - All actions SHA-pinned
#   - cosign keyless signing (Sigstore OIDC)
#   - SBOM generated by BuildKit
#
# WARNING: consumers verify signatures against an identity built from this
# workflow's path (syntropic137 PR #819 pins
# .github/workflows/build-workspace-images.yml with a ref regexp covering
# main and release). Renaming or moving this file breaks their verification.
#
# `release.published` is deliberately NOT a trigger. A release event can be
# created directly against any ref and would bypass the PR gate on `release`
# entirely, so publishing must only ever be driven by a push to `release`.
# =============================================================================

name: Build Workspace Images

on:
  push:
    # `release` publishes the consumer-facing tags. `main` publishes edge only.
    # The distinction is enforced in the "Determine version" step below.
    branches: [main, release]
    paths:
      - "providers/workspaces/**"
      - "plugins/**"
      - "lib/python/**"
      - "scripts/build-provider.py"
  pull_request:
    paths:
      - "providers/workspaces/**"
      - "plugins/**"
      - "lib/python/**"
      - "scripts/build-provider.py"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (e.g. v1.1.0). Defaults to version from manifest."
        required: false
      dry_run:
        description: "Dry run — build but don't push or sign"
        type: boolean
        default: false

concurrency:
  group: build-workspace-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: agentparadise

jobs:
  # ---------------------------------------------------------------------------
  # Integration gate (claude-cli): build the image single-arch, run the
  # entrypoint integration suite against it. build-push depends on this, so a
  # broken entrypoint/memory surface never gets published or signed.
  # See ADR-037.
  # ---------------------------------------------------------------------------
  integration-gate:
    name: "Integration Gate: claude-cli"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # build-provider.py default = single-arch `docker build` for the runner
      # arch, loaded into the local daemon and tagged
      # agentic-workspace-claude-cli:latest (the image the tests resolve by
      # default). No push.
      - name: Build claude-cli image (loaded into daemon)
        run: uv run scripts/build-provider.py claude-cli

      # Deps from the agentic_isolation env (docker + dev extras: pytest,
      # pytest-asyncio, docker SDK). Tests live at repo root tests/integration.
      # Hindsight-dependent cases skip when no backend is reachable (lean gate).
      - name: Run entrypoint integration tests
        working-directory: lib/python/agentic_isolation
        run: |
          uv sync --locked --all-extras
          uv run python -m pytest ../../../tests/integration -q

  build-push:
    name: "Build: ${{ matrix.provider }}"
    runs-on: ubuntu-latest
    needs: [integration-gate]
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: claude-cli
            image: agentic-workspace-claude-cli
            platforms: linux/amd64,linux/arm64
          - provider: interactive-tmux
            image: agentic-workspace-interactive-tmux
            platforms: linux/amd64,linux/arm64

    steps:
      # -------------------------------------------------------------------
      # Checkout
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------------------
      # Python + uv (for build-provider.py staging)
      # -------------------------------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # -------------------------------------------------------------------
      # Stage build context
      # -------------------------------------------------------------------
      - name: Stage build context
        run: uv run scripts/build-provider.py ${{ matrix.provider }} --stage-only

      # -------------------------------------------------------------------
      # Determine version + tags
      # -------------------------------------------------------------------
      - name: Determine version
        id: version
        run: |
          # Provider manifest version
          MANIFEST_VERSION=$(grep '^version:' providers/workspaces/${{ matrix.provider }}/manifest.yaml | awk '{print $2}' | tr -d '"')
          # CLI version from staged Dockerfile
          CLI_VERSION=$(grep 'ARG CLAUDE_CLI_VERSION=' build/${{ matrix.provider }}/Dockerfile | cut -d= -f2)
          # Tag override from input
          TAG_OVERRIDE="${{ inputs.tag }}"

          if [[ -n "$TAG_OVERRIDE" ]]; then
            VERSION="${TAG_OVERRIDE#v}"
          else
            VERSION="${MANIFEST_VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "cli_version=${CLI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "manifest_version=${MANIFEST_VERSION}" >> "$GITHUB_OUTPUT"

          # ---------------------------------------------------------------
          # Channel selection.
          #
          # is_release  publish the consumer-facing tags (version, cli
          #             version, latest) plus the sha tag. Only ever true for
          #             the `release` branch, which is PR-only and gated.
          # is_dev      publish :edge and :<sha> only. Unstable images from
          #             main. Never :latest, never a version tag.
          # should_push either of the above. False on pull requests, so a PR
          #             builds and tests without touching the registry.
          #
          # workflow_dispatch follows the ref it was dispatched from, so
          # dispatching from main cannot move :latest either.
          # ---------------------------------------------------------------
          IS_RELEASE=false
          IS_DEV=false

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.ref }}" == "refs/heads/release" ]]; then
              IS_RELEASE=true
            elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              IS_DEV=true
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" != "true" ]]; then
            if [[ "${{ github.ref }}" == "refs/heads/release" ]]; then
              IS_RELEASE=true
            else
              IS_DEV=true
            fi
          fi

          SHOULD_PUSH=false
          if [[ "$IS_RELEASE" == "true" || "$IS_DEV" == "true" ]]; then
            SHOULD_PUSH=true
          fi

          if [[ "$IS_RELEASE" == "true" ]]; then
            CHANNEL=release
          elif [[ "$IS_DEV" == "true" ]]; then
            CHANNEL=edge
          else
            CHANNEL=none
          fi

          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "is_dev=${IS_DEV}" >> "$GITHUB_OUTPUT"
          echo "should_push=${SHOULD_PUSH}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------
      # Docker Buildx + QEMU
      # -------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: ${{ matrix.platforms }}

      # -------------------------------------------------------------------
      # GHCR login
      # -------------------------------------------------------------------
      - name: Log in to GHCR
        if: steps.version.outputs.should_push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------
      # Docker metadata (tags + labels)
      # -------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            # Manifest version, e.g. 2.0.0. Release channel only.
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_release == 'true' }}
            # Bundled CLI version, e.g. 2.1.76. Release channel only.
            type=raw,value=${{ steps.version.outputs.cli_version }},enable=${{ steps.version.outputs.is_release == 'true' }}
            # Latest. Release channel only, so a push to main cannot move it.
            type=raw,value=latest,enable=${{ steps.version.outputs.is_release == 'true' }}
            # Edge. Development builds from main. Unstable, not for consumers.
            type=raw,value=edge,enable=${{ steps.version.outputs.is_dev == 'true' }}
            # Git SHA. Always computed, and immutable in practice, so it is the
            # tag to reach for when you need a specific edge build.
            type=sha,prefix=
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Agentic Workspace - ${{ matrix.provider }} provider
            org.opencontainers.image.vendor=AgentParadise
            org.opencontainers.image.source=https://github.com/AgentParadise/agentic-primitives
            agentic.provider=${{ matrix.provider }}
            agentic.provider.version=${{ steps.version.outputs.manifest_version }}
            agentic.cli.version=${{ steps.version.outputs.cli_version }}
            # release = gated, reviewed, consumer-facing.
            # edge = built from main, unreviewed, unstable.
            # none = built in a pull request and never published.
            agentic.image.channel=${{ steps.version.outputs.channel }}

      # -------------------------------------------------------------------
      # Build + Push
      # -------------------------------------------------------------------
      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: build/${{ matrix.provider }}
          file: build/${{ matrix.provider }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: ${{ steps.version.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # -------------------------------------------------------------------
      # Sign with cosign (keyless OIDC)
      #
      # Both channels are signed. The signature attests provenance (this
      # workflow, this repo, this ref), not review. Consumers that verify
      # fail-closed would break on an unsigned edge image, and an unsigned
      # image is not safer than a signed unreviewed one.
      # -------------------------------------------------------------------
      - name: Install cosign
        if: steps.version.outputs.should_push == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        if: steps.version.outputs.should_push == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_YES: "true"
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}"
          echo "Signing ${IMAGE}@${DIGEST}"
          cosign sign "${IMAGE}@${DIGEST}"

      # -------------------------------------------------------------------
      # Summary
      # -------------------------------------------------------------------
      - name: Write build summary
        run: |
          echo "## Workspace Image: ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Provider | \`${{ matrix.provider }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Manifest Version | \`${{ steps.version.outputs.manifest_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CLI Version | \`${{ steps.version.outputs.cli_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platforms | \`${{ matrix.platforms }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Channel | \`${{ steps.version.outputs.channel }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pushed | \`${{ steps.version.outputs.should_push }}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.version.outputs.should_push }}" == "true" ]]; then
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [[ "${{ steps.version.outputs.is_dev }}" == "true" ]]; then
              echo "> Edge build from \`main\`. Unstable and unreviewed. Do not depend on it; use a release digest instead." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "### Verify" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
