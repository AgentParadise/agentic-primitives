# =============================================================================
# Check: Docker Dry Run
# =============================================================================
# Builds every published workspace image without pushing or signing, so a
# release PR cannot merge with a broken image build.
#
# Single-arch (linux/amd64) and cache-backed on purpose: this is a build
# correctness gate, not the release build. The real multi-arch build, push and
# cosign signing happen in build-workspace-images.yml on push to `release`.
#
# There is no registry login, no id-token permission and push is disabled, so
# this workflow cannot publish.
#
# Called by: release-gate.yml
#
# NOTE: reusable workflows must live at the top level of .github/workflows/.
# The `_check-` prefix is the convention for workflow_call-only workflows.
# =============================================================================

name: Check - Docker Dry Run

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docker-dry-run:
    name: "Dry Run: ${{ matrix.provider }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        provider: [claude-cli, interactive-tmux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Stage build context
        run: uv run scripts/build-provider.py ${{ matrix.provider }} --stage-only

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: build/${{ matrix.provider }}
          file: build/${{ matrix.provider }}/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
